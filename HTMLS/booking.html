<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FutsalZone | Booking</title>

    <link rel="stylesheet" href="../CSS/style.css">

</head>

<body>


    <nav class="navbar">

        <div class="logo">

            <div class="logo-icon">⚽</div>

            <h2>FutsalZone</h2>

        </div>


        <ul class="nav-links">

            <li><a href="index.html">Home</a></li>
            <li><a href="courts.html">Courts</a></li>
            <li><a href="booking.html" class="active">Booking</a></li>
            <li><a href="schedule.html">Schedule</a></li>
            <li><a href="contact.html">Contact</a></li>

        </ul>

    </nav>


    <section class="container">

        <div class="section-title">

            <h1>Book Your Court</h1>

            <p>
                Fill in the form below.
            </p>

        </div>


        <div class="form-container">

            <form>


                <div class="form-row">

                    <div class="form-group">

                        <label>Full Name</label>

                        <input
                            type="text"
                            placeholder="Enter your name">

                    </div>


                    <div class="form-group">

                        <label>Email</label>

                        <input
                            type="email"
                            placeholder="Enter your email">

                    </div>

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label>Select Court</label>

                        <select>

                            <option>Premium Arena</option>
                            <option>Green Field</option>
                            <option>Night Arena</option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>Number of Players</label>

                        <input
                            type="number"
                            min="1"
                            max="20"
                            placeholder="10">

                    </div>

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label>Date</label>

                        <input type="date">

                    </div>


                    <div class="form-group">

                        <label>Time</label>

                        <input type="time">

                    </div>

                </div>


                <div class="form-group">

                    <label>Special Request</label>

                    <textarea
                        placeholder="Write any special request here...">
                    </textarea>

                </div>


                <button type="submit" class="btn">

                    Submit Booking

                </button>


            </form>

        </div>

    </section>


    <footer>

        <div class="footer-bottom">

            <p>
                © 2026 FutsalZone
            </p>

        </div>

    </footer>


</body>

</html>
